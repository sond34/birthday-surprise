<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise ❤️</title>

  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      text-align: center;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .container {
      margin-top: 100px;
    }

    h1 {
      font-size: 35px;
      color: white;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      background: white;
    }

    #letter {
      display: none;
      font-size: 20px;
      width: 80%;
      margin: auto;
      margin-top: 40px;
      color: white;
      animation: fadeIn 2s;
    }

    #video {
      display: none;
      margin-top: 40px;
    }

    #final {
      display: none;
      font-size: 30px;
      color: white;
      margin-top: 30px;
      animation: fadeIn 2s;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="start">
      <h1>Do you love me? ❤️</h1>
      <button onclick="startLove()">Yes 💖</button>
    </div>

    <div id="letter">
      <p>
        Today is not just your birthday… it’s the day my whole world was born. <br><br>
        I love you more than words can ever explain 💕
      </p>
    </div>

    <video id="video" width="80%" controls>
      <source src="yourvideo.mp4" type="video/mp4">
    </video>

    <div id="final">
      Happy Birthday My Everything ❤️🎉
    </div>

  </div>

  <script>
    function startLove() {
      document.getElementById("start").style.display = "none";

      const letter = document.getElementById("letter");
      letter.style.display = "block";

      setTimeout(() => {
        letter.style.display = "none";

        const video = document.getElementById("video");
        video.style.display = "block";
        video.play();

        video.onended = function() {
          document.getElementById("final").style.display = "block";
        };

      }, 5000); // Letter shows for 5 seconds
    }
  </script>

</body>
</html>
