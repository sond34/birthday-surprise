<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Special Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:url("couple-bg.png") no-repeat center center fixed;
background-size:cover;
overflow:hidden;
color:white;
}

/* Dark overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:-1;
}

/* Sections */
.section{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

/* Hidden by default */
.hidden{
display:none;
}

/* Glass box */
.glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,0,150,0.6);
max-width:450px;
}

/* Buttons */
button{
padding:10px 25px;
margin:10px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.yes{
background:#ff4da6;
color:white;
}

.no{
background:white;
color:#ff4da6;
}

button:hover{
transform:scale(1.1);
}

/* Floating hearts */
.heart{
position:absolute;
animation:float 6s linear infinite;
}

.balloon{
position:absolute;
font-size:30px;
animation:balloonFloat 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
100%{transform:translateY(-10vh);opacity:1;}
}

@keyframes balloonFloat{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

/* Typewriter */
#letterText{
white-space:pre-line;
font-size:18px;
min-height:120px;
}
video{
width:90%;
max-width:400px;
border-radius:20px;
margin-top:20px;
}
</style>
</head>

<body>

<!-- Soft Music -->
<audio id="bgMusic" loop>
<source src="yourvideo.mp4" type="audio/mp4">
</audio>

<!-- 1️⃣ Opening -->
<div class="section" id="start">
<div class="glass">
<h2>Will you open your surprise? 💌</h2>
<br>
<button class="yes" onclick="startStory()">Yes 💖</button>
<button class="no" onclick="moveNo(this)">No 🙈</button>
</div>
</div>

<!-- 2️⃣ Letter -->
<div class="section hidden" id="letter">
<div class="glass">
<h2>For You ❤️</h2>
<br>
<div id="letterText"></div>
<br>
<button class="yes" onclick="showVideo()">Next 🎥</button>
</div>
</div>

<!-- 3️⃣ Video -->
<div class="section hidden" id="videoSection">
<div class="glass">
<h2>Our Beautiful Moment 💞</h2>
<video controls>
<source src="yourvideo.mp4" type="video/mp4">
</video>
<br>
<button class="yes" onclick="showFinal()">Final Surprise ✨</button>
</div>
</div>

<!-- 4️⃣ Final Wish -->
<div class="section hidden" id="final">
<div class="glass">
<h2>Forever & Always ❤️</h2>
<br>
<p>You are my greatest blessing.  
Every heartbeat of mine whispers your name.  
I love you endlessly 💖✨</p>
</div>
</div>

<script>

let text = `You are the most beautiful part of my life.

Every moment with you feels magical.
Your smile lights up my darkest days.

Today is special,
because YOU are special.

Happy Birthday My Love ❤️`;

let i=0;

function startStory(){
document.getElementById("start").classList.add("hidden");
document.getElementById("letter").classList.remove("hidden");
document.getElementById("bgMusic").play();
typeWriter();
createHearts();
createBalloons();
}

function typeWriter(){
if(i<text.length){
document.getElementById("letterText").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,40);
}
}

function showVideo(){
document.getElementById("letter").classList.add("hidden");
document.getElementById("videoSection").classList.remove("hidden");
}

function showFinal(){
document.getElementById("videoSection").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
}

function moveNo(btn){
btn.style.position="absolute";
btn.style.top=Math.random()*80+"%";
btn.style.left=Math.random()*80+"%";
}

function createHearts(){
for(let i=0;i<30;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+15+"px";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);
}
}

function createBalloons(){
for(let i=0;i<10;i++){
let balloon=document.createElement("div");
balloon.className="balloon";
balloon.innerHTML="🎈";
balloon.style.left=Math.random()*100+"vw";
balloon.style.animationDuration=(Math.random()*5+5)+"s";
document.body.appendChild(balloon);
}
}

</script>

</body>
</html>
