<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Buji ❤️</title>

<!-- Google Font for handwritten letter style -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
padding:0;
background:black;
font-family:Arial, sans-serif;
text-align:center;
color:white;
overflow:hidden;
}

/* sections */
.section{
display:none;
height:100vh;
width:100vw;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
box-sizing:border-box;
}

/* START screen */
#start{
display:flex;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
flex-direction:column;
justify-content:center;
align-items:center;
}

/* playful YES button */
button{
padding:16px 32px;
font-size:20px;
margin:12px;
border:none;
border-radius:50px;
background:white;
color:#ff4b6e;
font-weight:bold;
cursor:pointer;
position:relative;
transition: all 0.3s ease;
box-shadow:0 0 10px rgba(255,75,110,0.5);
}

button:hover{
transform:scale(1.1) rotate(-3deg);
box-shadow:0 0 20px rgba(255,75,110,0.8);
}

/* floating hearts on button click */
.button-heart{
position:absolute;
animation:buttonHeart 1s ease forwards;
font-size:24px;
pointer-events:none;
}

@keyframes buttonHeart{
0%{transform:translateY(0) scale(1); opacity:1;}
50%{transform:translateY(-40px) scale(1.4); opacity:0.8;}
100%{transform:translateY(-80px) scale(0.8); opacity:0;}
}

/* LETTER */
#letter{
font-size:20px;
background:linear-gradient(135deg, #ffe6e6, #fff0f5);
overflow-y:auto;
line-height:1.8;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,75,110,0.5);
font-family:'Dancing Script', cursive;
color:#800000;
text-align:left;
max-width:800px;
margin:auto;
position:relative;
z-index:2;
white-space:pre-wrap;
}

/* VIDEO */
#video{
width:100vw;
height:100vh;
object-fit:cover;
display:none;
z-index:1;
}

/* FINAL */
#final{
font-size:22px;
background:linear-gradient(135deg, #ffe6e6, #fff0f5);
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
border-radius:20px;
box-shadow:0 0 30px rgba(255,75,110,0.5);
line-height:1.6;
color:#800000;
position:relative;
z-index:2;
white-space:pre-wrap;
}

/* floating emojis */
.emoji{
position:absolute;
animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
from{
transform:translateY(100vh) rotate(0deg);
opacity:1;
}
to{
transform:translateY(-10vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="section" style="display:flex;">
<h2 style="font-size:28px;">Do you love me? ❤️</h2>
<button onclick="showLetter(); animateButtonHearts(this)">YES 💖</button>
<button id="noBtn" onclick="noClick()">NO 🙈</button>
</div>

<!-- LETTER -->
<div id="letter" class="section">
<p id="letterText"></p>
</div>

<!-- VIDEO -->
<video id="video">
<source src="yourvideo.mp4" type="video/mp4">
</video>

<!-- FINAL -->
<div id="final" class="section">
<p id="finalText"></p>
</div>

<script>
// NO becomes YES cutely
function noClick(){
let btn=document.getElementById("noBtn");
btn.innerHTML="YES 💖";
btn.onclick=showLetter;
}

// Animate hearts on button click
function animateButtonHearts(button){
for(let i=0;i<10;i++){
let h=document.createElement("div");
h.className="button-heart";
h.style.left=(Math.random()*button.offsetWidth-10)+"px";
h.style.top=(Math.random()*button.offsetHeight-10)+"px";
h.innerHTML="❤️";
button.appendChild(h);
setTimeout(()=>{h.remove();},1000);
}
}

// Show letter with typewriter effect
const letterContent = `
My Buji, My Pari, 💋

Our story isn’t about grand gestures or loud words. It lives in the quiet moments — the smiles we share, the laughter that sneaks in, the comfort of just being near you. Somehow, without even realizing, my heart found its home in you. 💋

You care so naturally, love so effortlessly, and in that, I see a beauty that words can barely capture. Being with you feels like coming back to a place I didn’t know I was missing — calm, comforting, real. Every little moment with you makes my world brighter, my heart lighter, and my soul fuller. 💋

I want you to know, no matter what life brings, my heart will always choose you. You are my safe place, my joy, my love — and being yours is the easiest, happiest thing I’ve ever known. 💋

Happy Birthday, my love.
Always yours. Only yours.
Suyu ❤️💋
`;

const finalContent = `
Happy Birthday, my irresistible troublemaker! 🎂💖💋

You’re not just my favorite distraction — you’re my obsession, my partner-in-crime, and the reason my heart races for no reason at all. Every time you smile, my brain forgets how to function… and I love it. 😏💋

I hope your day is as dangerously handsome, fun, and tempting as you are… and yes, that includes a little extra undivided attention from me. I might even steal a kiss or two when you least expect it. 😘

You make every moment feel like mischief wrapped in magic. I can’t promise to behave today — after all, birthdays are for spoiling, teasing… and maybe a little trouble together. 😉

Love you more than cake… and trust me, I really mean that. ❤️💖
You’re my favorite distraction, my sweetest addiction, and the reason I can’t stop smiling.
Here’s to you, to us, and to every cheeky, flirty, unforgettable moment we’re yet to make. 🔥💖💋
`;

// Typewriter effect function
function typeWriter(text, element, speed=25, callback=null){
let i=0;
element.innerHTML="";
let interval = setInterval(()=>{
if(i<text.length){
element.innerHTML += text[i];
i++;
}else{
clearInterval(interval);
if(callback) callback();
}
}, speed);
}

// Show letter then video
function showLetter(){
document.getElementById("start").style.display="none";
let letter=document.getElementById("letter");
letter.style.display="flex";
let letterText=document.getElementById("letterText");
typeWriter(letterContent, letterText, 20, ()=>{
setTimeout(()=>{
letter.style.display="none";
let video=document.getElementById("video");
video.style.display="block";
video.play();
video.onended=function(){
video.style.display="none";
showFinal();
};
}, 1000);
});
}

// Show final with typewriter + floating emojis
function showFinal(){
let final=document.getElementById("final");
final.style.display="flex";
let finalText=document.getElementById("finalText");
typeWriter(finalContent, finalText, 20);

// floating emojis
let emojis=["❤️","❤️","❤️","🎂","🎈","🎈","🌹","🌹","💖","💖","💘","🌺","🌷","💝","💋"];
setInterval(()=>{
let e=document.createElement("div");
e.className="emoji";
e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
e.style.left=Math.random()*100+"vw";
e.style.fontSize=(25+Math.random()*40)+"px";
document.body.appendChild(e);
setTimeout(()=>{ e.remove(); },6000);
},200);
}
</script>

</body>
</html>
