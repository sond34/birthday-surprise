<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Special Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:url("couple-bg.png") no-repeat center center fixed;
background-size:cover;
overflow:hidden;
color:white;
}

/* Dark overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* Section layout */
.section{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.hidden{
display:none;
}

/* Glass box */
.glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(255,0,150,0.6);
max-width:420px;
}

/* Buttons */
button{
padding:10px 25px;
margin:10px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:16px;
}

.yes{
background:#ff4da6;
color:white;
}

.no{
background:white;
color:#ff4da6;
}

/* Video */
video{
width:90%;
max-width:400px;
border-radius:15px;
margin-top:20px;
}

/* Floating hearts */
.heart{
position:absolute;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
100%{transform:translateY(-10vh);opacity:1;}
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="yourvideo.mp4" type="audio/mp4">
</audio>

<!-- START -->
<div id="start" class="section">
<div class="glass">
<h2>Will you open your surprise? 💌</h2>
<br>
<button class="yes" onclick="goLetter()">Yes 💖</button>
<button class="no" onclick="moveNo(this)">No 🙈</button>
</div>
</div>

<!-- LETTER -->
<div id="letter" class="section hidden">
<div class="glass">
<h2>For You ❤️</h2>
<p style="margin-top:15px;">
You are the most beautiful part of my life.<br><br>
Every moment with you feels magical.<br><br>
Your smile lights up my world.<br><br>
Happy Birthday My Love 💖
</p>
<br>
<button class="yes" onclick="goVideo()">Next 🎥</button>
</div>
</div>

<!-- VIDEO -->
<div id="videoSection" class="section hidden">
<div class="glass">
<h2>Our Beautiful Moment 💞</h2>
<video controls>
<source src="yourvideo.mp4" type="video/mp4">
</video>
<br>
<button class="yes" onclick="goFinal()">Final Surprise ✨</button>
</div>
</div>

<!-- FINAL -->
<div id="final" class="section hidden">
<div class="glass">
<h2>Forever & Always ❤️</h2>
<p style="margin-top:15px;">
You are my greatest blessing.<br><br>
I love you endlessly 💖✨
</p>
</div>
</div>

<script>

function goLetter(){
document.getElementById("start").classList.add("hidden");
document.getElementById("letter").classList.remove("hidden");
document.getElementById("music").play();
createHearts();
}

function goVideo(){
document.getElementById("letter").classList.add("hidden");
document.getElementById("videoSection").classList.remove("hidden");
}

function goFinal(){
document.getElementById("videoSection").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
}

function moveNo(btn){
btn.style.position="absolute";
btn.style.top=Math.random()*80+"%";
btn.style.left=Math.random()*80+"%";
}

function createHearts(){
for(let i=0;i<25;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+15+"px";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);
}
}

</script>

</body>
</html>
