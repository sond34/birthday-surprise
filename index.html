<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💖</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background:url("couple-bg.png") center/cover no-repeat;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* POPUP */
#popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:10;
}

.popup-box{
  background:#ffffff;
  padding:25px;
  border-radius:20px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.popup-box h2{
  color:#ff4d88;
  margin-bottom:10px;
}

.popup-box p{
  font-size:14px;
  margin-bottom:15px;
}

.popup-btns{
  display:flex;
  justify-content:space-around;
}

.popup-btns button{
  border:none;
  padding:10px 20px;
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
}

#yesBtn{
  background:#ff4d88;
  color:#fff;
}

#noBtn{
  background:#ddd;
}

/* MAIN CONTENT */
#mainContent{
  display:none;
  text-align:center;
  color:white;
  padding:20px;
  animation:fade 1s ease-in;
}

@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

.heart{
  font-size:40px;
  animation:beat 1s infinite;
}

@keyframes beat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.3);}
}
</style>
</head>

<body>

<!-- POPUP -->
<div id="popup">
  <div class="popup-box">
    <h2>Before we continue... 💕</h2>
    <p>Be honest with me 😊<br>Do you love me more than everything else? 😘</p>

    <div class="popup-btns">
      <button id="yesBtn">YES 💖</button>
      <button id="noBtn">NO 🙈</button>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent">
  <h1>Happy Birthday My Love 🎂💖</h1>
  <p>You are my world, my happiness, my forever 💫</p>
  <p>I promise to love you today, tomorrow, and always ❤️</p>
  <div class="heart">💗</div>
  <h3>18 March 🎉</h3>
</div>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function(){

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const popup = document.getElementById("popup");
  const main = document.getElementById("mainContent");

  yesBtn.onclick = function(){
    popup.style.display = "none";
    main.style.display = "block";
  }

  noBtn.onclick = function(){
    alert("Aww 😢 but I still love you forever ❤️");
  }

});
</script>

</body>
</html>
