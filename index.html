<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Buji ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
}

/* Sections */
.section{
    display:none;
    height:100vh;
    width:100vw;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    padding:20px;
    box-sizing:border-box;
    position:relative;
}

/* START */
#start{
    display:flex;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    color:white;
    text-align:center;
}

/* Buttons */
button{
    padding:16px 32px;
    font-size:20px;
    margin:12px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff4b6e;
    font-weight:bold;
    cursor:pointer;
    transition:all 0.3s ease;
    box-shadow:0 0 15px rgba(255,75,110,0.6);
}
button:hover{
    transform:scale(1.1) rotate(-3deg);
    box-shadow:0 0 25px rgba(255,75,110,1);
}

/* Letter & Final */
#letter, #final{
    font-family:'Dancing Script', cursive;
    max-width:900px;
    max-height:90vh;
    overflow-y:auto;
    padding:50px;
    border-radius:25px;
    line-height:1.8;
    font-size:21px;
    text-align:left;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:flex-start;
    position:relative;
    white-space:pre-wrap;
    margin:auto;

    background:
      linear-gradient(rgba(255,240,245,0.85), rgba(255,240,245,0.85)),
      url("couple-bg.png");
    background-size:cover;
    background-position:center;

    box-shadow:0 0 40px rgba(255,75,110,0.6);
    animation:fadeIn 0.8s ease;
}

/* Fade */
@keyframes fadeIn{
    from{opacity:0; transform:scale(0.95);}
    to{opacity:1; transform:scale(1);}
}

/* Video */
#video{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:none;
}

/* Floating hearts */
.emoji{
    position:absolute;
    animation:floatUp 6s linear forwards;
    pointer-events:none;
}
@keyframes floatUp{
    from{transform:translateY(100vh) rotate(0deg); opacity:1;}
    to{transform:translateY(-10vh) rotate(360deg); opacity:0;}
}

/* Spark balloons & hearts */
.spark{
    position:absolute;
    animation:sparkFloat 5s linear forwards;
    pointer-events:none;
}
@keyframes sparkFloat{
    0%{transform:translateY(0) scale(0.8); opacity:1;}
    100%{transform:translateY(-120vh) scale(1.4); opacity:0;}
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="section">
    <h2 style="font-size:32px; font-family:'Dancing Script', cursive;">
        Before we begin… 💕
    </h2>
    <p style="font-size:20px;">
        Do you love me more than chocolate, sleep & your phone? 😏
    </p>
    <button onclick="showLetter(); animateButtonHearts(this); heartsShower()">YES 💖</button>
    <button id="noBtn" onclick="noClick()">NO 🙈</button>
</div>

<!-- LETTER -->
<div id="letter" class="section">
    <p id="letterText"></p>
</div>

<!-- VIDEO -->
<video id="video" muted playsinline>
    <source src="yourvideo.mp4" type="video/mp4">
</video>

<!-- FINAL -->
<div id="final" class="section">
    <p id="finalText"></p>
</div>

<script>
/* Playful NO */
function noClick(){
    let btn=document.getElementById("noBtn");
    btn.innerHTML="YES 💖 (No escape 😘)";
    btn.onclick=showLetter;
    heartsShower();
}

/* Button hearts */
function animateButtonHearts(button){
    for(let i=0;i<12;i++){
        let h=document.createElement("div");
        h.className="emoji";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(20+Math.random()*30)+"px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    }
}

/* Hearts Shower */
function heartsShower(){
    for(let i=0;i<40;i++){
        let h=document.createElement("div");
        h.className="emoji";
        h.innerHTML="💖";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(20+Math.random()*30)+"px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),6000);
    }
}

/* Letter Content */
const letterContent = `
My Buji, My Pari, 💋

Our story lives in the quiet moments — the smiles we share, the laughter that sneaks in, and the comfort of simply being close. Without even realizing it, my heart chose you… and it has never looked back. 💖

You love so naturally, care so deeply, and somehow make everything brighter just by existing. Being with you feels like home — calm, safe, and real.

No matter what life brings, my heart will always choose you.

Happy Birthday, my love.
Always yours. Only yours.
Suyu ❤️
`;

/* Final Wish */
const finalContent = `
Happy Birthday, my irresistible troublemaker! 🎂💖

You’re my favorite distraction, my sweetest addiction, and the reason my heart races for no reason at all.

I hope your day is as dangerously handsome and magical as you are… and yes, I plan to steal a kiss or two. 😘

Here’s to us, to love, to mischief, and to every unforgettable moment ahead. ❤️🔥
`;

/* Typewriter */
function typeWriter(text, element, speed=25, callback=null){
    let i=0;
    element.innerHTML="";
    let interval=setInterval(()=>{
        if(i<text.length){
            element.innerHTML+=text[i];
            element.scrollTop=element.scrollHeight;
            i++;
        } else{
            clearInterval(interval);
            if(callback) callback();
        }
    },speed);
}

/* Show Letter */
function showLetter(){
    document.getElementById("start").style.display="none";
    let letter=document.getElementById("letter");
    letter.style.display="flex";
    let letterText=document.getElementById("letterText");

    typeWriter(letterContent,letterText,25,()=>{
        setTimeout(()=>{
            letter.style.display="none";
            let video=document.getElementById("video");
            video.style.display="block";
            video.play();

            video.onended=function(){
                video.style.display="none";
                showFinal();
            };
        },1000);
    });
}

/* Show Final with Spark Balloons */
function showFinal(){
    let final=document.getElementById("final");
    final.style.display="flex";
    let finalText=document.getElementById("finalText");
    typeWriter(finalContent,finalText,25);

    let items=["❤️","💖","💘","💝","🎈","🎈","✨","✨","💋"];
    let interval=setInterval(()=>{
        let s=document.createElement("div");
        s.className="spark";
        s.innerHTML=items[Math.floor(Math.random()*items.length)];
        s.style.left=Math.random()*100+"vw";
        s.style.bottom="-40px";
        s.style.fontSize=(30+Math.random()*40)+"px";
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),5000);
    },180);

    setTimeout(()=>clearInterval(interval),20000);
}
</script>

</body>
</html>
