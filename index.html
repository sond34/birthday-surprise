<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Special Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("couple-bg.png") no-repeat center center fixed;
background-size:cover;
overflow:hidden;
}

/* Dark overlay so text is readable */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-1;
}

/* Glass Letter Box */
.container{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:40px;
border-radius:20px;
text-align:center;
color:white;
max-width:400px;
box-shadow:0 0 30px rgba(255,0,150,0.6);
}

/* Opening */
h1{
font-size:26px;
margin-bottom:20px;
animation:fadeIn 2s ease-in-out;
}

/* Buttons */
button{
padding:10px 25px;
margin:10px;
border:none;
border-radius:25px;
cursor:pointer;
font-size:16px;
transition:0.3s;
}

.yes{
background:#ff4da6;
color:white;
}

.no{
background:white;
color:#ff4da6;
}

button:hover{
transform:scale(1.1);
}

/* Hidden message */
.message{
display:none;
margin-top:20px;
font-size:18px;
animation:fadeIn 2s ease-in-out;
}

/* Floating Hearts */
.heart{
position:absolute;
color:pink;
animation:float 6s linear infinite;
}

/* Balloons */
.balloon{
position:absolute;
font-size:30px;
animation:balloonFloat 10s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
100%{transform:translateY(-10vh);opacity:1;}
}

@keyframes balloonFloat{
0%{transform:translateY(100vh);}
100%{transform:translateY(-10vh);}
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="yourvideo.mp4" type="audio/mp4">
</audio>

<div class="container">

<h1>Will you open your surprise? 💌</h1>

<button class="yes" onclick="showMessage()">Yes 💖</button>
<button class="no" onclick="moveNo(this)">No 🙈</button>

<div class="message" id="message">
💞 You are my most beautiful blessing.  
Every moment with you feels magical.  
I love you endlessly ❤️✨
</div>

</div>

<script>

function showMessage(){
document.getElementById("message").style.display="block";
createHearts();
createBalloons();
}

function moveNo(btn){
btn.style.position="absolute";
btn.style.top=Math.random()*80+"%";
btn.style.left=Math.random()*80+"%";
}

function createHearts(){
for(let i=0;i<20;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=Math.random()*20+15+"px";
heart.style.animationDuration=(Math.random()*3+3)+"s";
document.body.appendChild(heart);
}
}

function createBalloons(){
for(let i=0;i<10;i++){
let balloon=document.createElement("div");
balloon.className="balloon";
balloon.innerHTML="🎈";
balloon.style.left=Math.random()*100+"vw";
balloon.style.animationDuration=(Math.random()*5+5)+"s";
document.body.appendChild(balloon);
}
}

</script>

</body>
</html>
