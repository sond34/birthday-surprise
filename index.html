<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Buji ❤️</title>

<style>
body{
  margin:0;
  padding:0;
  background:black;
  font-family:Arial;
  text-align:center;
  color:white;
  overflow:hidden;
}

/* sections */
.section{
  display:none;
  height:100vh;
  width:100vw;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
  box-sizing:border-box;
}

/* start screen */
#start{
  display:flex;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  flex-direction:column;
}

/* buttons */
button{
  padding:14px 28px;
  font-size:18px;
  margin:12px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff4b6e;
  font-weight:bold;
  cursor:pointer;
  transition:transform 0.2s;
}
button:hover{
  transform:scale(1.1);
}

/* NO button shake animation */
#noBtn:hover{
  animation: shake 0.5s;
}
@keyframes shake{
  0% { transform: translateX(0px); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
  100% { transform: translateX(0px); }
}

/* YES button playful hover */
#yesBtn:hover{
  transform: scale(1.1) rotate(-2deg);
}

/* letter */
#letter{
  font-size:18px;
  background:black url('kiss_cartoon.png') center bottom no-repeat;
  background-size:contain;
  overflow-y:auto;
  line-height:1.6;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:left;
  max-width:700px;
  max-height:90vh;
  padding-bottom:200px; /* for image spacing */
}

/* video */
#video{
  width:100vw;
  height:100vh;
  object-fit:cover;
  display:none;
}

/* final */
#final{
  font-size:20px;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  max-width:700px;
  overflow:hidden;
}

/* floating emojis */
.emoji{
  position:absolute;
  animation:floatUp 6s linear infinite;
}
@keyframes floatUp{
  from{ transform:translateY(100vh); opacity:1; }
  to{ transform:translateY(-10vh); opacity:0; }
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="section" style="display:flex;">
  <h2>Are you ready to admit… you’re mine? 😏❤️</h2>
  <button id="yesBtn" onclick="showLetter()">Obvs, duh! 💘😉</button>
  <button id="noBtn" onclick="noClick()">Try saying NO… I dare you 😈😉</button>
</div>

<!-- LETTER -->
<div id="letter" class="section"></div>

<!-- VIDEO -->
<video id="video">
  <source src="yourvideo.mp4" type="video/mp4">
</video>

<!-- FINAL -->
<div id="final" class="section"></div>

<script>
// naughty NO click
function noClick(){
    let btn=document.getElementById("noBtn");
    btn.innerHTML="Fine… but you know you want to 💖😏";
    btn.onclick=showLetter;
    alert("Haha! No escaping me 😈💘");
}

// emojis generator
function spawnEmojis(){
    let emojis=["❤️","🎈","🌹","💖","🎂","💘","🌺"];
    let e=document.createElement("div");
    e.className="emoji";
    e.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.fontSize=(25+Math.random()*40)+"px";
    document.body.appendChild(e);
    setTimeout(()=>{ e.remove(); },6000);
}

// typewriter effect for letter
let letterCounter=0;
function typeLetter(text, container, callback){
    let i=0;
    let interval=setInterval(()=>{
        container.innerHTML+=text[i];
        i++;
        letterCounter++;
        if(letterCounter % 3 === 0) spawnEmojis();
        if(i>=text.length){
            clearInterval(interval);
            if(callback) callback();
        }
    },30);
}

// show letter section
function showLetter(){
    document.getElementById("start").style.display="none";
    let letter=document.getElementById("letter");
    letter.style.display="flex";
    letter.innerHTML="";

    let text=`My Buji, My Pari,

Our story isn’t about grand gestures or loud words. It lives in the quiet moments — the smiles we share, the laughter that sneaks in, the comfort of just being near you. Somehow, without even realizing, my heart found its home in you.

You care so naturally, love so effortlessly, and in that, I see a beauty that words can barely capture. Being with you feels like coming back to a place I didn’t know I was missing — calm, comforting, real. Every little moment with you makes my world brighter, my heart lighter, and my soul fuller.

I want you to know, no matter what life brings, my heart will always choose you. You are my safe place, my joy, my love — and being yours is the easiest, happiest thing I’ve ever known.

Happy Birthday, my love.
Always yours. Only yours.
Suyu ❤️💋`;

    typeLetter(text, letter, ()=> {
        setTimeout(()=>{
            letter.style.display="none";
            let video=document.getElementById("video");
            video.style.display="block";
            video.play();
            video.onended = showFinal;
        },2000);
    });
}

// show final section instantly with emojis
function showFinal(){
    let final=document.getElementById("final");
    final.style.display="flex";

    final.innerHTML=`Happy Birthday, my irresistible troublemaker! 🎂💖<br><br>
You’re my obsession, my partner-in-crime, and the reason my heart races for no reason at all. Every time you smile, my brain forgets how to function… and I love it. 😏<br><br>
I hope your day is as dangerously fun and tempting as you are… maybe a little extra attention from me 😉<br><br>
Love you more than cake… and trust me, I really mean that. ❤️`;

    // spawn emojis faster
    setInterval(spawnEmojis,200);
}
</script>

</body>
</html>
