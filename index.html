<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Buji ❤️</title>

<style>
body{
margin:0;
padding:0;
background:black;
font-family:Arial;
text-align:center;
color:white;
overflow:hidden;
}

/* sections */
.section{
display:none;
height:100vh;
width:100vw;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
box-sizing:border-box;
}

/* start screen */
#start{
display:flex;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
flex-direction:column;
}

/* buttons */
button{
padding:14px 28px;
font-size:18px;
margin:12px;
border:none;
border-radius:30px;
background:white;
color:#ff4b6e;
font-weight:bold;
cursor:pointer;
transition:transform 0.2s;
}
button:hover{
transform:scale(1.1);
}

/* NO button shake animation */
#noBtn:hover{
animation: shake 0.5s;
}

@keyframes shake{
0% { transform: translateX(0px); }
20% { transform: translateX(-5px); }
40% { transform: translateX(5px); }
60% { transform: translateX(-5px); }
80% { transform: translateX(5px); }
100% { transform: translateX(0px); }
}

/* YES button playful hover */
#yesBtn:hover{
transform: scale(1.1) rotate(-2deg);
}

#letter{
font-size:18px
